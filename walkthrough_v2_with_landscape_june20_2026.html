.wt2-stage svg [data-step]{opacity:0;transition:opacity .35s}

@media (prefers-reduced-motion: reduce){.wt2-stage svg .pulse-line{animation:none}.wt2-stage svg #agent-mover{transition:none}}

<script>
(function(){
const steps=[
{t:'an agent (alone, for now)',
b:'A single agent navigates a non-social world by learning from experience. The agent may learn <strong>from</strong> their own actions or outcomes <strong>about</strong> what to do next, or any kind of state of the environment.',
cite:'',
lH:'examples',
lB:'<em>learning from the world</em>: the agent picks up which cues predict reward and how those contingencies shift, with no other agent involved (O\u2019Doherty et al., 2003).<br><br><em>learning from their own actions and outcomes</em>: by acting and seeing what follows, they work out what to do, either by trial and error or by running an internal model of the world (Daw et al., 2011).<strong style="margin-top:12px">how this gets modeled</strong>learning here is temporal difference: not one shot but a running update, where each outcome at time t revises the expectation for t plus 1 through a prediction error (Schultz et al., 1997), and the learning rate can track how volatile the world is (Behrens et al., 2007). In the brain, dopamine carries these prediction errors (Pessiglione et al., 2006).'},

{t:'another agent enters the scene',
b:'A second agent appears. Now learning can be social: an agent can learn <strong>from</strong> this other agent (e.g. a stranger, friend, partner, advisor, teacher, confederate) and/or <strong>about</strong> this other agent. Likely multiple of these processes happen at once.',
cite:'',
lH:'examples',
lB:'<em>learning from advice</em>: an agent learns from another\u2019s suggestions about how reliable that adviser is, folded into their own reward learning (Behrens et al., 2008). A Bayesian version instead infers the adviser\u2019s shifting intentions (Diaconescu et al., 2014).<br><br><em>observational learning</em>: an agent learns from watching another\u2019s choices and outcomes about which actions are worth taking (Burke et al., 2010).<br><br><em>prosocial learning</em>: an agent learns from the outcomes another person receives about which of their own actions benefit that other (Lockwood et al., 2016).<br><br><em>learning about the other</em>: an agent learns from an opponent\u2019s responses about their strategy (Hampton et al., 2008), builds a model that simulates how the other person decides (Suzuki et al., 2012), or tracks stable traits such as generosity (Hackel et al., 2015).<br><br><em>multiple social learning strategies</em>: there is no single way to learn socially. An agent chooses whom to learn from, copying the majority or the most successful, and these strategies can themselves emerge from reward learning rather than being fixed rules (Schultner et al., 2025).<br><br><em>imitation versus emulation</em>: watching someone act, an agent can copy the action itself or instead infer the goal behind it, and the agent arbitrates between these two strategies depending on which is more reliable (Charpentier et al., 2020).<strong style="margin-top:12px">how social learning gets modeled</strong><em>built on individual learning</em>: social-learning models often reuse the same machinery as individual learning, adding a social parameter such as a social learning rate, which sets how strongly each new piece of social information updates what the agent has learned, so social information can be weighted differently from the agent\u2019s own experience (Lockwood &amp; Klein-Fl\u00fcgge, 2021).<br><br><em>in the brain</em>: social prediction errors show up partly in the same reward circuitry as individual learning (ventral striatum, vmPFC) and partly in regions tied to social cognition such as the anterior and subgenual cingulate cortex (Behrens et al., 2008; Lockwood et al., 2016).'},

{t:'multiple other agents',
b:'With more than one other agent around, what the agent learns <strong>about</strong> one other can carry over to a new one they have never met. Who they learn <strong>from</strong> and who they learn <strong>about</strong> need not be the same.',
cite:'',
lH:'examples',
lB:'<em>generalizing from one other to another</em>: after learning that one person is trustworthy or not, an agent transfers that judgment to a new stranger who resembles them, with the amygdala and caudate carrying the transferred value (FeldmanHall et al., 2018).<br><br><em>reasoning about how others reason</em>: in a many-player guessing game, people choose by anticipating how deeply the others are thinking, and a cognitive hierarchy model captures these levels of recursive reasoning, with the higher levels tracked in medial prefrontal cortex (Coricelli &amp; Nagel, 2009).<strong style="margin-top:12px">how this gets modeled</strong>the transfer is modeled as ordinary stimulus generalization, learned value spreading to similar others, with no social-specific mechanism (FeldmanHall et al., 2018).'},

{t:'source, target, and context',
b:'Computational social neuroscience distinguishes what we learn <strong>from</strong> others (the <strong>source</strong>) from what we learn <strong>about</strong> them (the <strong>target</strong>) (Lockwood &amp; Klein-Flügge, 2021; Zhang et al., 2020; Olsson et al., 2020; Charpentier &amp; O\u2019Doherty, 2018). Which role a study foregrounds is the researcher\u2019s choice. In reality we always learn <strong>from</strong> something, often several things across time, <strong>about</strong> something, often several things. Sometimes the source and the target coincide. What the learner builds is an internal <strong>representation</strong>, a model of the target that can be of any content (a stimulus, a state, an action, or an outcome); when the source and target coincide it is a single model of one agent. And <strong>context</strong>, like being observed or sharing a task, shapes the learning. In this review a study counts as social if its source, target, context, or any combination of them is social. Some would not count individual, experiential learning in a social setting as social learning, since it is not second hand, but we keep the term broad here because it is more encompassing.',
cite:'',
lH:'source, target, and context',
lB:'<em>source</em>: who or what we learn from.<br><br><em>target</em>: who or what we learn about.<br><br><em>context</em>: the circumstances and other factors that modulate learning.<br><br><em>representation</em>: the internal model the agent updates, of any type and any content.<strong style="margin-top:12px">a worked example</strong>take prosocial learning, where you discover by trial and error which of your actions earn rewards for another person (Lockwood et al., 2016). The <b>source</b> is the reward outcomes the other receives, the feedback you learn from. The <b>target</b> is the value of your own actions, what you learn about. The <b>context</b> is that you are acting on someone else\u2019s behalf rather than your own. In the framework\u2019s terms the source content is an outcome and its type is another person, while the target content is an action.'},

{t:'interaction with feedback',
b:'Social learning is rarely one-way. The agent acts, the other reacts, and the loop repeats. Each round, the agent learns <strong>from</strong> what the other just did and updates what they believe <strong>about</strong> them, then acts again. This back and forth is what makes social learning interactive rather than just observed.',
cite:'',
lH:'examples',
lB:'<em>iterated trust</em>: across repeated rounds of a trust game, how much one partner reciprocates shapes how much the other trusts them on the next round, so trust gets built up turn by turn (King-Casas et al., 2005).<br><br><em>modeling the other modeling you</em>: in a strategic game an agent does better by representing how the other reasons, including how the other models the agent in return, which models capture as nested levels of theory of mind (Yoshida et al., 2008).<strong style="margin-top:12px">how this gets modeled</strong>to capture two interacting agents, the model gives the learner an internal model of the partner, what they want and how they are likely to respond. As both act, each updates their model of the other, so a single model can carry the whole back and forth rather than one isolated learner (Hampton et al., 2008).'},

{t:'a group',
b:'A <strong>group</strong> is a defined collective, and it can sit anywhere in the learning: the agent can be inside one, learn <strong>from</strong> one, or learn <strong>about</strong> one. Groups can also contain subgroups, like a faction within a team or an ingroup within a wider community.',
cite:'',
lH:'examples',
lB:'<em>ingroup and outgroup</em>: people more readily and more stubbornly learn to fear members of another racial group than their own, so group membership itself biases what is learned (Olsson et al., 2005).<br><br><em>stereotypes steer reward learning</em>: when players from two groups share rewards at equal rates, people still form more positive associations with the positively stereotyped group, so a societal stereotype bends individual learning toward prejudice (Schultner et al., 2024a).<br><br><em>bias spreads by watching</em>: just observing someone else interact with two groups is enough to pick up their group bias, one route by which prejudice passes between people (Schultner et al., 2024b).<strong style="margin-top:12px">how social learning gets modeled</strong>group effects usually run on the same reward and observational learning machinery as individual learning, with group membership entering as a prior or a bias on value rather than as a separate group-specific system (Olsson et al., 2020).'},

{t:'a network of other agents',
b:'Other agents are not isolated, they are tied together in a network. What the agent can learn <strong>from</strong> depends on their position, since information travels only along the links, and they also learn <strong>about</strong> the shape of the network itself to anticipate where information will go.',
cite:'',
lH:'examples',
lB:'<em>strategic gossip</em>: people track who is connected to whom and how popular each person is, then use that mental map of the network to spread information far while keeping it away from its target (Xia et al., 2025).<br><br><em>how behaviour spreads</em>: whether a behaviour catches on depends on the structure of ties, since some network shapes carry it further and faster than others (Centola, 2018).<strong style="margin-top:12px">how this gets modeled</strong>the learner is given an internal map of the network and uses it to predict how information cascades from one tie to the next, so position and connection become part of what is learned (Xia et al., 2025).'},

{t:'social structure',
b:'<strong>Social structure</strong> is the layer of norms, hierarchies, and conventions around everything.',
cite:'',
lH:'examples',
lB:'<em>inferring latent groups</em>: from watching who chooses what, people infer hidden group structure and then use it to decide whose choices to follow, going beyond surface similarity or stated labels (Gershman et al., 2017).<strong style="margin-top:12px">how this gets modeled</strong>structure is treated as a latent variable the learner infers, assigning people to hidden groups from their behavior using a Bayesian prior over possible groupings, the same structure-learning machinery used outside the social domain (Gershman &amp; Cikara, 2020).'},

{t:'everything together',
b:'And this is how a social learning agent navigates, or fails to navigate, the social world. Browse the website to learn more!',
cite:'',
lH:'',
lB:''}
];

const positions={
default:{x:140,y:376},
network:{x:160,y:316},
group:{x:160,y:228},
subgroup:{x:240,y:236}
};

const svg=document.getElementById('wt2-svg');
const stepNum=document.getElementById('wt2-step-num');
const stepTitle=document.getElementById('wt2-step-title');
const stepBody=document.getElementById('wt2-step-body');
const stepCite=document.getElementById('wt2-step-cite');
const stepLegend=document.getElementById('wt2-step-legend');
const back=document.getElementById('wt2-back');
const next=document.getElementById('wt2-next');
const dots=document.getElementById('wt2-dots');
const mover=document.getElementById('agent-mover');
const agentCard=document.getElementById('agent-card');

let i=1;
steps.forEach(()=>{const d=document.createElement('div');d.className='wt2-dot';dots.appendChild(d)});

function render(){
stepNum.textContent='step '+i+' / '+steps.length;
stepTitle.textContent=steps[i-1].t;
stepBody.innerHTML=steps[i-1].b;
stepCite.textContent=steps[i-1].cite||'';
stepLegend.innerHTML='<strong>'+steps[i-1].lH+'</strong>'+steps[i-1].lB;
stepLegend.style.display=(steps[i-1].lB||steps[i-1].lH)?'':'none';
svg.querySelectorAll('[data-step]').forEach(el=>{
el.classList.toggle('show',Number(el.dataset.step)<=i);
});
// New: data-step-only — visible only on that step
svg.querySelectorAll('[data-step-only]').forEach(el=>{
el.style.opacity = (Number(el.dataset.stepOnly)===i)?1:0;
});
// New: data-step-from — visible from step N onward
svg.querySelectorAll('[data-step-from]').forEach(el=>{
el.style.opacity = (i>=Number(el.dataset.stepFrom))?1:0;
});
// interaction arrows: show at step 5 and once the agent is back home, hide while it sits in a group/network
var ia=document.getElementById('interaction-arrows');
if(ia){ia.style.opacity=(i>=5&&i!==6&&i!==7)?1:0;}
dots.querySelectorAll('.wt2-dot').forEach((d,idx)=>d.classList.toggle('on',idx<i));
back.disabled=i===1;
next.disabled=i===steps.length;
let pos=positions.default;
if(i===6){pos=positions.group;agentCard.style.opacity='0';}
else if(i===7){pos=positions.network;agentCard.style.opacity='0';}
else{agentCard.style.opacity='1';}
mover.setAttribute('transform','translate('+pos.x+' '+pos.y+')');
}

back.addEventListener('click',()=>{if(i>1){i--;render()}});
const startBtn=document.getElementById('wt2-start-btn');
const cover=document.getElementById('wt2-cover');
if(startBtn&&cover){startBtn.addEventListener('click',()=>{cover.style.display='none';});cover.addEventListener('click',(e)=>{if(e.target===cover){cover.style.display='none';}});}

next.addEventListener('click',()=>{if(i<steps.length){i++;render()}});
const restart=document.getElementById('wt2-restart');
if(restart){restart.addEventListener('click',()=>{i=1;render();});}
const timeBadge=document.getElementById('wt2-time-badge');
function updateTime(){/* badge text is static 't → t+1'; visibility driven by data-step */}
const _origRender=render;
render=function(){_origRender();updateTime();};
render();
})();
</script><script>
/* Make cited papers clickable: wrap "Author et al., YEAR" style citations in a
   link back to the site's own paper card (Papers tab, filtered to that citation)
   when embedded in the review iframe; falls back to Google Scholar only when
   opened standalone (no parent site to route into). Runs on load and on any
   dynamically rendered content. */
(function () {
  var CITE = /\b([A-Z][A-Za-z.'’-]+(?:\s+et al\.| (?:&amp;|&|and) [A-Z][A-Za-z.'’-]+)?),?\s*\(?((?:19|20)\d{2})\)?/g;
  var SKIP = { A: 1, SCRIPT: 1, STYLE: 1, BUTTON: 1 };
  function hasParentSite() {
    try { return !!(window.parent && window.parent !== window && window.parent.brainStudyClicked); }
    catch (e) { return false; }
  }
  function goToPaperCard(citationText) {
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.brainStudyClicked === 'function') {
          window.parent.brainStudyClicked(citationText);
          return true;
        }
        window.parent.postMessage({ type: 'brainStudyClick', citation: citationText }, '*');
        return true;
      }
    } catch (e) {}
    return false;
  }
  function linkifyTextNode(node) {
    var text = node.nodeValue;
    if (!text || text.length < 6 || !/\d{4}/.test(text)) return;
    CITE.lastIndex = 0;
    if (!CITE.test(text)) return;
    CITE.lastIndex = 0;
    var embedded = hasParentSite();
    var frag = document.createDocumentFragment(), last = 0, m;
    while ((m = CITE.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      let citeText = m[0].replace(/&amp;/g, '&');
      var a = document.createElement('a');
      a.href = embedded ? '#' : ('https://scholar.google.com/scholar?q=' + encodeURIComponent(citeText));
      if (!embedded) { a.target = '_blank'; a.rel = 'noopener'; }
      a.style.color = 'inherit'; a.style.textDecoration = 'underline dotted';
      a.title = embedded ? 'Open this paper on the review site' : 'Look up on Google Scholar';
      a.textContent = citeText;
      if (embedded) {
        a.addEventListener('click', function (ev) {
          ev.preventDefault();
          if (!goToPaperCard(citeText)) {
            window.open('https://scholar.google.com/scholar?q=' + encodeURIComponent(citeText), '_blank', 'noopener');
          }
        });
      }
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  function walk(root) {
    var stack = [root];
    while (stack.length) {
      var n = stack.pop();
      if (n.nodeType === 3) { linkifyTextNode(n); continue; }
      if (n.nodeType !== 1 || SKIP[n.tagName]) continue;
      for (var c = n.firstChild; c; c = c.nextSibling) stack.push(c);
    }
  }
  var obs, pending = false;
  function run() {
    pending = false;
    if (obs) obs.disconnect();
    try { walk(document.body); } catch (e) {}
    if (obs) obs.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  function schedule() { if (!pending) { pending = true; setTimeout(run, 120); } }
  if (document.readyState !== 'loading') run(); else document.addEventListener('DOMContentLoaded', run);
  obs = new MutationObserver(schedule);
  obs.observe(document.body, { childList: true, subtree: true, characterData: true });
})();
</script>
